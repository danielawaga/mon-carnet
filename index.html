ckground:#f8e4db;color:#9c6552}.day-dot.today{box-shadow:0 0 0 3px #d7ebe7}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:14px}.legend b{color:var(--teal)}.note{white-space:pre-wrap;overflow-wrap:anywhere}.entry-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.entry-meta time{color:var(--muted);font-size:12px}.entry-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}.mini-action{border:0;background:none;color:var(--teal);font-weight:600;font-size:12px;padding:7px 2px}.empty{padding:30px 18px;text-align:center;border:1px dashed #d5dcd8;border-radius:20px;color:var(--muted);background:rgba(255,255,255,.55)}.empty .icon{width:28px;height:28px;color:var(--teal);margin-bottom:10px}.empty p{font-size:14px}.tabs{display:flex;gap:6px;border-radius:15px;background:#ecefeb;padding:4px;margin-bottom:18px}.tabs button{flex:1;border:0;border-radius:11px;padding:10px;background:transparent;color:#657174;font-weight:650}.tabs button.active{background:#fff;color:var(--teal);box-shadow:0 2px 7px #0000000b}.bottom{position:fixed;bottom:0;z-index:20;left:50%;transform:translateX(-50%);max-width:560px;width:100%;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #e5e6e2;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);padding:9px 10px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -8px 20px #00000008}.bottom button{border:0;background:transparent;color:#77808c;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;min-height:54px;justify-content:center}.bottom button.active{color:var(--teal);font-weight:700}.bottom .icon{width:23px;height:23px}.modal-wrap{position:fixed;z-index:40;inset:0;background:rgba(11,31,37,.38);display:flex;align-items:flex-end;justify-content:center}.modal{width:min(560px,100%);max-height:min(92dvh,880px);overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 45px #0002}.modal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.modal-top h2{font-size:25px}.modal .hint{font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.actions>*{flex:1}.radio-line{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);background:white;border-radius:14px;margin-top:8px}.radio-line input{accent-color:var(--teal);width:18px;height:18px}.toast{position:fixed;z-index:60;left:50%;bottom:calc(91px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#203d3e;color:white;border-radius:13px;padding:12px 18px;font-size:13px;max-width:calc(100% - 36px);box-shadow:0 8px 22px #0003}.topic{font-size:12px;color:var(--muted);margin:9px 0}.separator{height:1px;background:#eaece9;margin:13px 0}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line)}.settings-row:first-of-type{border-top:0}.readonly-preview{background:#f5f7f5;border-radius:12px;padding:10px;font-size:13px;color:var(--muted);margin-top:10px}.toggle{accent-color:var(--teal);width:20px;height:20px}.description{font-size:14px;color:var(--muted);margin-top:5px}.situation-card{position:relative}.situation-card .row{align-items:flex-start}.situation-card .pill{margin-left:auto}.subtle-block{background:#fff8ee;border-radius:13px;padding:13px;margin-top:13px;color:#48515a;font-size:14px}.subtle-block strong{display:block;color:var(--ink);margin-bottom:4px}.detail-pair{margin:14px 0}.detail-pair strong{display:block;font-size:13px;margin-bottom:5px}.detail-pair p{margin:0}.title-with-icon{display:flex;gap:9px;align-items:center}.title-with-icon .icon{color:var(--teal)}.home-observe textarea{min-height:86px;margin:12px 0 10px}.home-observe .btn{width:100%}.help-note{font-size:12px;color:var(--muted);margin-top:9px}.screen-spacer{height:5px}@media(min-width:561px){body{background:#ecefeb}.app{min-height:100vh}.modal-wrap{align-items:center}.modal{border-radius:24px;max-height:90vh}.bottom{border-radius:20px 20px 0 0}}@media(prefers-reduced-motion:no-preference){.btn,.chip,.card,.bottom button{transition:background-color .16s,color .16s,transform .16s}.btn:active{transform:scale(.985)}}
  </style>

<div id="app" class="app"></div>
<script>
(()=>{
  'use strict';
  const KEY='mon-carnet-v1';
  const DAYS=['L','M','M','J','V','S','D'];
  const DAYNAMES=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
  const SUBJECTS=['Général','Sport','Études'];
  const starter=()=>({version:1,profile:{name:'',showName:true},routines:[],logs:[],journal:[],situations:[],principles:[
    {id:uid(),title:'Préparer la prochaine action',why:'Laisser une phrase pour savoir où reprendre.',context:'À la fin d’une séance.',status:'À essayer',pinned:true},
    {id:uid(),title:'Donner une fin à la séance',why:'Choisir à l’avance le temps que je souhaite y consacrer.',context:'Lorsque la tâche pourrait s’étendre indéfiniment.',status:'À essayer',pinned:false},
    {id:uid(),title:'Observer avant de modifier',why:'Noter ce qui a bloqué, puis essayer un ajustement précis.',context:'Quand une routine devient difficile à tenir.',status:'À essayer',pinned:false}
  ],topics:['EDP','RO','TOEIC']});
  function uid(){return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9)}
  let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')||starter()}catch{data=starter()}
  if(!data||!Array.isArray(data.routines)||!Array.isArray(data.logs)||!Array.isArray(data.journal)||!Array.isArray(data.situations)||!Array.isArray(data.principles))data=starter();
  data.profile=data.profile||{name:'',showName:true};data.topics=Array.isArray(data.topics)?data.topics:['EDP','RO','TOEIC'];
  function normalizePrinciples(){data.principleSections=Array.isArray(data.principleSections)?data.principleSections:[];data.principles.forEach(p=>{p.subject=SUBJECTS.includes(p.subject)?p.subject:'Général';p.topic=typeof p.topic==='string'?p.topic:'';p.sectionId=data.principleSections.some(x=>x.id===p.sectionId)?p.sectionId:''})}
  normalizePrinciples();
  let principleSearchText='',principleSubjectFilter='Toutes',principleTopicFilter='Toutes';
  let route='today',detailId=null,repTab='situations',subjectFilter='Toutes',topicFilter='Toutes',searchText='',modal='',editId=null,toastTimer;
  const $=s=>document.querySelector(s), e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"></use></svg>`;
  const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  const addDays=(s,n)=>{let [y,m,d]=s.split('-').map(Number),x=new Date(y,m-1,d+n);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
  const localDate=s=>{let [y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
  const dayIndex=s=>(localDate(s).getDay()+6)%7;
  const niceDate=s=>localDate(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  const stamp=s=>new Date(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{showToast('Enregistrement impossible : espace du navigateur indisponible.');return false}};
  function showToast(msg){let old=$('.toast');if(old)old.remove();let n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.append(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),3200)}
  function wall(type){return `<div class="wall wall--${type}"><svg viewBox="0 0 560 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="560" height="240" fill="#fbf8f3"/><circle cx="463" cy="106" r="42" fill="#f8d7c3" opacity=".86"/><path d="M0 192c83-44 150-35 221-16s96-15 160-16c58-1 109 46 179 11v69H0z" fill="#f5efe6" opacity=".74"/><path d="M0 215c90-36 155-5 223 5 82 12 164-51 337-15v35H0z" fill="#f7f2eb"/><g transform="translate(490 146)" fill="none" stroke="#749690" stroke-width="2.4" stroke-linecap="round"><path d="M2 89C3 59-8 35-28 15M3 76c12-29 25-43 42-52M0 60c-3-12-15-21-26-25"/><path fill="#94b0a9" stroke="none" d="M-27 15C-50 14-53-2-50-16c19 0 30 11 23 31zM-24 33C-44 29-47 16-45 6c18 3 26 13 21 27zM20 51C14 34 24 17 45 17c0 20-9 30-25 34zM3 76C-17 67-20 51-15 39 0 48 7 61 3 76z"/></g></svg></div>`}
  function head(title,subtitle='',type='detail',back='',extra=''){return `${wall(type)}<header class="head ${type==='detail'?'compact':''}"><div class="head-row">${back?`<button class="back" data-route="${back}">${icon('back')} Retour</button>`:`<span class="date">${e(niceDate(today()))}</span>`}${extra||`<button class="icon-btn" data-route="settings" aria-label="Paramètres">${icon('settings')}</button>`}</div><h1>${e(title)}</h1>${subtitle?`<p>${e(subtitle)}</p>`:''}</header>`}
  const nav=()=>`<nav class="bottom" aria-label="Navigation principale">${[['today','home','Aujourd’hui'],['journal','book','Journal'],['repères','sprout','Mes repères']].map(([r,i,t])=>`<button data-route="${r}" class="${(route===r||(r==='repères'&&['situation','situations'].includes(route)))?'active':''}" ${route===r?'aria-current="page"':''}>${icon(i)}<span>${t}</span></button>`).join('')}</nav>`;
  const empty=(symbol,msg)=>`<div class="empty">${icon(symbol)}<p>${e(msg)}</p></div>`;
  const logFor=(id,date)=>data.logs.find(x=>x.routineId===id&&x.date===date);
  const planned=(r,date)=>r.status==='active'&&r.days.includes(dayIndex(date));
  const subjectOption=(selected='Général')=>SUBJECTS.map(x=>`<option ${selected===x?'selected':''}>${x}</option>`).join('');
  const routineName=id=>data.routines.find(x=>x.id===id)?.title||'';
  function home(){let name=data.profile.showName&&data.profile.name?.trim()?`Bonjour ${data.profile.name.trim()}`:'Bonjour';let todays=data.routines.filter(x=>x.status==='active'&&(planned(x,today())||logFor(x.id,today()))),next=data.routines.find(x=>x.status==='active'&&x.next?.trim()),p=data.principles.find(x=>x.pinned);
    return head(name,'Un pas à la fois.','today')+`<section class="section card home-observe"><h3 class="title-with-icon">${icon('pen')} Qu’est-ce qui s’est passé ?</h3><form id="quick-journal"><textarea class="field" name="text" placeholder="Une observation, une idée…" required></textarea><button class="btn wide" type="submit">${icon('plus')} Écrire</button></form></section><section class="section"><div class="section-title"><h2>Mes routines</h2><button class="link" data-route="routines">Voir tout ${icon('chevron')}</button></div>${todays.length?`<div class="card">${todays.map(r=>routineRow(r)).join('')}</div>`:empty('calendar','Aucune séance prévue aujourd’hui.')}<button class="link" data-modal="routine" style="margin-top:9px">+ Nouvelle routine</button></section>${next?`<section class="section card soft-mint"><div class="row between"><h3>Ma prochaine action</h3><span class="pill">${e(next.subject||'Général')}</span></div><p class="note">${e(next.next)}</p><button class="link" data-open-routine="${e(next.id)}">${e(next.title)} ${icon('chevron')}</button></section>`:''}${p?`<section class="section card soft-peach"><h3 class="title-with-icon">${icon('sprout')} Mon repère du moment</h3><p>${e(p.title)}</p>${p.why?`<p class="small muted">${e(p.why)}</p>`:''}</section>`:''}`;
  }
  function routineRow(r){let l=logFor(r.id,today());return `<div class="plain-row"><button class="check ${l?.status==='done'?'done':''}" data-toggle="${e(r.id)}" aria-label="${l?.status==='done'?'Annuler la séance':'Marquer la séance réalisée'} : ${e(r.title)}">${l?.status==='done'?icon('check'):''}</button><button class="plain-row grow" data-open-routine="${e(r.id)}" style="padding:0"><span class="grow"><strong style="display:block;color:var(--ink)">${e(r.title)}</strong><span>${l?.status==='done'?(l.version==='short'?'Version courte réalisée':'Séance réalisée'):e(r.subject||'Général')+(r.duration?' · '+e(r.duration):'')}</span></span>${icon('chevron')}</button></div>`}
  function routines(){let arr=data.routines;return head('Mes routines','','routines','today')+`<section class="section"><div class="section-title"><h2>Mes routines</h2><button class="btn small-btn" data-modal="routine">${icon('plus')} Ajouter</button></div>${arr.length?arr.map(r=>`<div class="card"><div class="row between"><div><h3>${e(r.title)}</h3><p class="small muted">${e(r.subject||'Général')} · ${r.days.length===7?'Tous les jours':r.days.map(i=>DAYNAMES[i]).join(', ')||'Sans jours fixes'}</p></div><span class="pill ${r.status==='paused'?'quiet':'try'}">${r.status==='paused'?'En pause':'En cours'}</span></div><button class="link" data-open-routine="${e(r.id)}" style="margin-top:8px">Ouvrir ${icon('chevron')}</button></div>`).join(''):empty('sprout','Tes routines apparaîtront ici.')}</section>`}
  function week(r){let start=addDays(today(),-dayIndex(today()));return `<div class="week">${DAYS.map((s,i)=>{let date=addDays(start,i),log=logFor(r.id,date),cls=log?.status==='done'?(log.version==='short'?'short':'done'):log?.status==='missed'?'missed':planned(r,date)?'planned':'',symbol=log?.status==='done'?'✓':log?.status==='missed'?'×':planned(r,date)?String(localDate(date).getDate()):'–';return `<div><div class="dlabel">${s}</div><button class="day-dot ${cls} ${date===today()?'today':''}" data-log-date="${date}" aria-label="${e(DAYNAMES[i])} ${e(date)} : ${log?.status==='done'?'réalisée':log?.status==='missed'?'non réalisée':planned(r,date)?'prévue':'repos'}">${symbol}</button></div>`}).join('')}</div><div class="legend"><span><b>✓</b> Réalisée</span><span>○ Prévue</span><span>– Repos</span><span>× Non réalisée</span></div>`}
  function routineDetail(){let r=data.routines.find(x=>x.id===detailId);if(!r)return routines();let l=logFor(r.id,today()), linked=data.journal.filter(x=>x.routineId===r.id).slice().reverse().slice(0,3),sit=data.situations.filter(x=>x.routineId===r.id);return head(r.title,r.description||'','detail','routines',`<button class="icon-btn" data-modal="routine" data-edit="${e(r.id)}" aria-label="Modifier">${icon('pen')}</button>`)+`<section class="section card"><h2 style="margin-bottom:17px">Cette semaine</h2>${week(r)}</section><section class="section card"><h2>Mon cadre</h2>${[['Départ',r.trigger],['Durée',r.duration],['Version courte',r.short]].filter(([,v])=>v).map(([k,v])=>`<div class="settings-row"><span class="muted">${e(k)}</span><strong>${e(v)}</strong></div>`).join('')||`<p class="description">Aucun détail ajouté.</p>`}</section><section class="section card"><div class="section-title"><h2>La séance du jour</h2><span class="pill">${e(r.subject||'Général')}</span></div><button class="plain-row" data-toggle="${e(r.id)}"><span class="check ${l?.status==='done'?'done':''}">${l?.status==='done'?icon('check'):''}</span><strong>${l?.status==='done'?'Séance réalisée':'Cocher la séance'}</strong></button><button class="plain-row" data-log-date="${today()}">${icon('clock')}<strong>${l?.version==='short'?'Version courte':'Détails de la séance'}</strong>${icon('chevron')}</button>${l?.note?`<p class="small note">${e(l.note)}</p>`:''}</section>${r.next?`<section class="section card soft-mint"><h3>Ma prochaine action</h3><p class="note">${e(r.next)}</p></section>`:''}${sit.length?`<section class="section"><h2 style="margin-bottom:10px">Astuces liées</h2>${sit.map(s=>`<button class="plain-row card" data-open-situation="${e(s.id)}">${icon('sprout')} <strong>${e(s.title)}</strong>${icon('chevron')}</button>`).join('')}</section>`:''}${linked.length?`<section class="section"><h2 style="margin-bottom:10px">Dernières notes</h2>${linked.map(x=>`<div class="card small"><span class="mu   function statusOf(s){let p=s.pistes||[];if(!p.length)return ['Piste à chercher','wait'];if(p.some(x=>x.status==='utile'))return ['Piste utile','good'];return ['Piste en cours d’essai','try']}

  function situationsList(){let all=data.situations.filter(s=>(subjectFilter==='Toutes'||s.subject===subjectFilter)&&(topicFilter==='Toutes'||s.topic===topicFilter)&&`${s.title} ${s.context||''} ${(s.pistes||[]).map(p=>p.text).join(' ')}`.toLocaleLowerCase().includes(searchText));let topics=subjectFilter==='Toutes'?[]:['Toutes',...new Set([...(subjectFilter==='Études'?data.topics:[]),...data.situations.filter(s=>s.subject===subjectFilter&&s.topic).map(s=>s.topic)])];return `<section class="section"><div class="search">${icon('search')}<input id="situation-search" type="search" placeholder="Rechercher une astuce…" value="${e(searchText)}" aria-label="Rechercher une astuce"></div></section><div class="chips">${['Toutes',...SUBJECTS].map(x=>`<button class="chip ${subjectFilter===x?'selected':''}" data-subject="${e(x)}">${e(x)}</button>`).join('')}</div>${topics.length?`<div class="chips">${topics.map(x=>`<button class="chip ${topicFilter===x?'selected':''}" data-topic="${e(x)}">${e(x)}</button>`).join('')}</div>`:''}<section class="section"><div class="section-title"><h2>Astuces contextuels</h2></div>${all.length?all.slice().reverse().map(s=>{let [status,cls]=statusOf(s);return `<article class="card situation-card"><div class="row between"><span class="overline">${e(s.subject)}${s.topic?' · '+e(s.topic):''}</span><span class="pill ${cls}">${status}</span></div><h3 style="margin-top:9px">${e(s.title)}</h3>${s.context?`<p class="description note">${e(s.context)}</p>`:''}<button class="link" data-open-situation="${e(s.id)}">Ouvrir ${icon('chevron')}</button></article>`}).join(''):empty('sprout',data.situations.length?'Aucune astuce ne correspond à cette recherche.':'Tes astuces apparaîtront ici.')}${!searchText?`<button class="btn wide" data-modal="situation" style="margin-top:14px">${icon('plus')} Ajouter une astuce</button>`:''}</section>`}

  function situationDetail(){let s=data.situations.find(x=>x.id===detailId);if(!s)return reps();let [status,cls]=statusOf(s),related=data.journal.filter(x=>x.situationId===s.id);return head(s.title,'','detail','repères',`<button class="icon-btn" data-modal="situation" data-edit="${e(s.id)}" aria-label="Modifier">${icon('pen')}</button>`)+`<section class="section card"><div class="row between"><span class="overline">${e(s.subject)}${s.topic?' · '+e(s.topic):''}</span><span class="pill ${cls}">${status}</span></div>${s.context?`<div class="detail-pair"><strong>Contexte</strong><p class="note">${e(s.context)}</p></div>`:''}${s.routineId?`<div class="detail-pair"><strong>Routine liée</strong><button class="link" data-open-routine="${e(s.routineId)}">${e(routineName(s.routineId))} ${icon('chevron')}</button></div>`:''}${!s.pistes?.length?`<div class="subtle-block"><strong>Aucune piste pour le moment.</strong>Les observations restent disponibles ici.</div>`:''}</section><section class="section"><div class="section-title"><h2>Mes pistes</h2><button class="btn small-btn" data-modal="piste" data-situation="${e(s.id)}">${icon('plus')} Ajouter</button></div>${s.pistes?.length?s.pistes.map(p=>`<div class="card"><div class="row between"><span class="pill ${p.status==='utile'?'good':'try'}">${p.status==='utile'?'Utile pour moi':'En cours d’essai'}</span><div><button class="mini-action" data-modal="piste" data-situation="${e(s.id)}" data-edit="${e(p.id)}">Modifier</button><button class="mini-action danger" data-delete="piste" data-id="${e(p.id)}">Supprimer</button></div></div><p class="note">${e(p.text)}</p></div>`).join(''):empty('sprout','Aucune piste ajoutée.')}</section><section class="section"><div class="section-title"><h2>Mes constats</h2><button class="btn small-btn secondary" data-modal="journal" data-situation="${e(s.id)}">${icon('plus')} Noter</button></div>${related.length?related.slice().reverse().map(j=>`<div class="card"><span class="small muted">${stamp(j.date)}</s     if(modal==='piste'){let s=data.situations.find(x=>x.id===window._linkSituation),p=s?.pistes?.find(x=>x.id===editId)||{text:'',status:'essai'};return modalShell(editId?'Modifier la piste':'Nouvelle piste',`<form id="piste-form"><label class="form-group"><span>Ma piste</span><textarea class="field" name="text" required placeholder="Ce que je pourrais essayer">${e(p.text)}</textarea></label><label class="form-group"><span>État</span><select class="field" name="status"><option value="essai" ${p.status==='essai'?'selected':''}>En cours d’essai</option><option value="utile" ${p.status==='utile'?'selected':''}>Utile pour moi</option></select></label><button class="btn wide">Enregistrer</button></form>`)}
    if(modal==='principle-section'){let section=data.principleSections.find(x=>x.id===editId)||{title:''};return modalShell(editId?'Renommer la sous-section':'Nouvelle sous-section',`<form id="principle-section-form"><label class="form-group"><span>Titre</span><input class="field" name="title" required maxlength="120" value="${e(section.title)}" placeholder="Quand on débute un domaine"></label><button class="btn wide">Enregistrer</button></form>`)}
    if(modal==='principle'){let p=data.principles.find(x=>x.id===editId)||{title:'',why:'',context:'',subject:principleSubjectFilter==='Toutes'?'Général':principleSubjectFilter,topic:'',sectionId:window._linkSection||'',status:'À essayer',pinned:false};return modalShell(editId?'Modifier le principe':'Nouveau principe',`<form id="principle-form"><label class="form-group"><span>Principe</span><input class="field" name="title" required value="${e(p.title)}" placeholder="Une idée à garder en tête"></label><label class="form-group"><span>Type de situation</span><select class="field" name="subject">${subjectOption(p.subject)}</select></label><label class="form-group"><span>Thème <small>· Facultatif</small></span><input class="field" name="topic" value="${e(p.topic)}" list="principle-topics" placeholder="EDP, RO, cardio…"><datalist id="principle-topics">${[...new Set([...data.topics,...data.principles.map(x=>x.topic).filter(Boolean)])].map(t=>`<option value="${e(t)}">`).join('')}</datalist></label><label class="form-group"><span>Sous-section</span><select class="field" name="sectionId"><option value="">Mes principes</option>${data.principleSections.map(g=>`<option value="${e(g.id)}" ${p.sectionId===g.id?'selected':''}>${e(g.title)}</option>`).join('')}</select></label><label class="form-group"><span>Ce que j’en retiens <small>· Facultatif</small></span><textarea class="field" name="why">${e(p.why)}</textarea></label><label class="form-group"><span>Quand cela m’aide <small>· Facultatif</small></span><textarea class="field" name="context">${e(p.context)}</textarea></label><label class="form-group"><span>État</span><select name="status" class="field">${['À essayer','Utile pour moi','À revoir'].map(v=>`<option ${p.status===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="radio-line"><input type="checkbox" name="pinned" ${p.pinned?'checked':''}><span>Afficher à l’accueil</span></label><button class="btn wide" style="margin-top:14px">Enregistrer</button>${editId?`<button type="button" class="link danger" data-delete="principle" data-id="${e(p.id)}">Supprimer ce principe</button>`:''}</form>`)}
    if(modal==='log'){let r=data.routines.find(x=>x.id===detailId),date=window._logDate||today(),l=logFor(r.id,date)||{status:'',version:'full',note:''};return modalShell(niceDate(date),`<form id="log-form"><p class="muted">${e(r.title)}</p><label class="form-group"><span>État de la séance</span><select class="field" name="status"><option value="" ${!l.status?'selected':''}>Non renseigné</option><option value="done" ${l.status==='done'?'selected':''}>Réalisée</option><option value="missed" ${l.status==='missed'?'selected':''}>Non réalisée</option></select></label><label class="form-group"><span>Format</span><select class="field" name="version"><option value="full" ${l.version!=='short'?'selected':''}>Habituel</option><option value="short" ${l.version==='short'?'selected':''}>Version courte</option></select></label><label class="form-group"><span>Note <small>· Facultatif</small></span><textarea class="field" name="note">${e(l.note)}</textarea></label><button class="btn wide">Enregistrer</button></form>`)}return ''}
  function closeModal(){modal='';editId=null;window._linkRoutine='';window._linkSituation='';window._linkSection='';render()}
  function go(r,id){route=r;detailId=id||null;modal='';editId=null;render();window.scrollTo(0,0)}
  function toggle(id){let l=logFor(id,today());if(l){if(l.status==='done'){l.status='';if(!l.note)data.logs=data.logs.filter(x=>x!==l)}else{l.status='done';l.version='full'}}else data.logs.push({id:uid(),routineId:id,date:today(),status:'done',version:'full',note:''});save();render()}
  function remove(kind,id){let names={journal:'cette note',situation:'cette astuce',routine:'cette routine et son suivi',principle:'ce principe',piste:'cette piste','principle-section':'cette sous-section'};let message=kind==='principle-section'?'Supprimer cette sous-section ? Ses principes seront conservés dans « Mes principes ».':`Supprimer ${names[kind]} ?`;if(!confirm(message))return;if(kind==='principle-section'){data.principleSections=data.principleSections.filter(x=>x.id!==id);data.principles.forEach(x=>{if(x.sectionId===id)x.sectionId=''})}if(kind==='piste'){let s=data.situations.find(x=>x.id===detailId);if(s)s.pistes=s.pistes.filter(x=>x.id!==id)}if(kind==='journal')data.journal=data.journal.filter(x=>x.id!==id);if(kind==='situation'){data.situations=data.situations.filter(x=>x.id!==id);data.journal.forEach(x=>{if(x.situationId===id)x.situationId=''})}if(kind==='routine'){data.routines=data.routines.filter(x=>x.id!==id);data.logs=data.logs.filter(x=>x.routineId!==id);data.journal.forEach(x=>{if(x.routineId===id)x.routineId=''});data.situations.forEach(x=>{if(x.routineId===id)x.routineId=''})}if(kind==='principle')data.principles=data.principles.filter(x=>x.id!==id);save();if(['situation','routine'].includes(kind))go(kind==='situation'?'repères':'routines');else closeModal();showToast('Élément supprimé')}
  document.addEventListener('click',ev=>{let t=ev.target.closest('button,[data-modal],[data-close]');if(!t)return;
    if(t.dataset.close!==undefined){closeModal();return}if(t.dataset.route){go(t.dataset.route);return}if(t.dataset.openRoutine){go('routine',t.dataset.openRoutine);return}if(t.dataset.openSituation){go('situation',t.dataset.openSituation);return}
    if(t.dataset.modal){modal=t.dataset.modal;editId=t.dataset.edit||null;window._linkRoutine=t.dataset.routine||'';window._linkSituation=t.dataset.situation||'';window._linkSection=t.dataset.section||'';render();$('.modal input:not([type=radio]):not([type=checkbox]),.modal textarea')?.focus();return}
    if(t.dataset.toggle){toggle(t.dataset.toggle);return}if(t.dataset.day!==undefined){t.classList.toggle('on');t.setAttribute('aria-pressed',t.classList.contains('on'));return}
    if(t.dataset.principleSubject){principleSubjectFilter=t.dataset.principleSubject;principleTopicFilter='Toutes';render();return}if(t.dataset.principleTopic){principleTopicFilter=t.dataset.principleTopic;render();return}
    if(t.dataset.reptab){repTab=t.dataset.reptab;render();return}if(t.dataset.subject){subjectFilter=t.dataset.subject;topicFilter='Toutes';render();return}if(t.dataset.topic){topicFilter=t.dataset.topic;render();return}if(t.dataset.logDate){window._logDate=t.dataset.logDate;modal='log';render();return}
    if(t.dataset.pin){data.principles.forEach(p=>p.pinned=p.id===t.dataset.pin?!p.pinned:false);save();render();return}if(t.dataset.pause){let r=data.routines.find(x=>x.id===t.dataset.pause);r.status=r.status==='paused'?'active':'paused';save();render();return}
    if(t.dataset.delete){remove(t.dataset.delete,t.dataset.id);return}
  });
  document.addEventListener('input',ev=>{if(['situation-search','principle-search'].includes(ev.target.id)){let id=ev.target.id,value=ev.target.value,pos=ev.target.selectionStart;if(id==='principle-search')principleSearchText=value.toLocaleLowerCase();else searchText=value.toLocaleLowerCase();render();let input=$('#'+id);input?.focus();try{input?.setSelectionRange(pos,pos)}catch{}}});
  document.addEventListener('submit',ev=>{let f=ev.target;if(!f.id)return;ev.preventDefault();let v=Object.fromEntries(new FormData(f).entries()),trim=x=>String(x||'').trim();
    if(f.id==='quick-journal'){if(!trim(v.text))return;data.journal.push({id:uid(),date:today(),text:trim(v.text),subject:'Général',routineId:'',situationId:''});save();render();showToast('Observation enregistrée');return}
    if(f.id==='profile-form'){data.profile={name:trim(v.name),showName:!!f.elements.showName.checked};save();render();showToast('Profil enregistré');return}
    if(f.id==='routine-form'){let days=[...f.querySelectorAll('.day-choice.on')].map(x=>Number(x.dataset.day));let obj={title:trim(v.title),description:trim(v.description),subject:v.subject,days,trigger:trim(v.trigger),duration:trim(v.duration),short:trim(v.short),next:trim(v.next)};if(!obj.title)return;let id=editId;if(id){Object.assign(data.routines.find(x=>x.id===id),obj)}else{id=uid();data.routines.push({id,status:'active',...obj})}save();go('routine',id);showToast('Routine enregistrée');return}
    if(f.id==='journal-form'){let obj={text:trim(v.text),date:v.date,subject:v.subject,routineId:v.routineId,situationId:v.situationId};if(!obj.text)return;if(editId)Object.assign(data.journal.find(x=>x.id===editId),obj);else data.journal.push({id:uid(),...obj});save();closeModal();showToast('Note enregistrée');return}
    if(f.id==='situation-form'){let obj={title:trim(v.title),context:trim(v.context),subject:v.subject,topic:trim(v.topic),routineId:v.routineId};if(!obj.title)return;if(obj.subject==='Études'&&obj.topic&&!data.topics.includes(obj.topic))data.topics.push(obj.topic);let id=editId;if(id)Object.assign(data.situations.find(x=>x.id===id),obj);else{id=uid();data.situations.push({id,...obj,pistes:trim(v.firstPiste)?[{id:uid(),text:trim(v.firstPiste),status:'essai'}]:[]})}save();go('situation',id);showToast('Astuce enregistrée');return}
    if(f.id==='piste-form'){let s=data.situations.find(x=>x.id===window._linkSituation);if(!s||!trim(v.text))return;if(editId)Object.assign(s.pistes.find(x=>x.id===editId),{text:trim(v.text),status:v.status});else s.pistes.push({id:uid(),text:trim(v.text),status:v.status});save();closeModal();showToast('Piste enregistrée');return}
    if(f.id==='principle-section-form'){let title=trim(v.title);if(!title)return;if(editId)data.principleSections.find(x=>x.id===editId).title=title;else data.principleSections.push({id:uid(),title});save();closeModal();showToast('Sous-section enregistrée');return}
    if(f.id==='principle-form'){let obj={title:trim(v.title),why:trim(v.why),context:trim(v.context),subject:v.subject,topic:trim(v.topic),sectionId:v.sectionId||'',status:v.status,pinned:!!f.elements.pinned.checked};if(!obj.title)return;if(obj.pinned)data.principles.forEach(x=>x.pinned=false);if(editId)Object.assign(data.principles.find(x=>x.id===editId),obj);else data.principles.push({id:uid(),...obj});save();closeModal();showToast('Principe enregistré');return}
    if(f.id==='log-form'){let date=window._logDate||today(),l=logFor(detailId,date);if(!l){l={id:uid(),routineId:detailId,date};data.logs.push(l)}Object.assign(l,{status:v.status,version:v.version,note:trim(v.note)});if(!l.status&&!l.note)data.logs=data.logs.filter(x=>x!==l);save();closeModal();showToast('Séance enregistrée');return}
    if(f.id==='export-form'){exportData(v.format,v.period);return}
  });
  function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
  function exportData(format,period){let cutoff=period==='all'?'0000-00-00':addDays(today(),-(Number(period)-1)), filtered={...data,logs:data.logs.filter(x=>x.date>=cutoff),journal:data.journal.filter(x=>x.date>=cutoff)};let filename='mon-carnet-'+today();if(format==='json'){download(filename+'.json',JSON.stringify({format:'mon-carnet',version:1,exportedAt:new Date().toISOString(),data},null,2),'application/json;charset=utf-8');showToast('Sauvegarde exportée');return}
    let lines=['# Mon carnet',`Export du ${niceDate(today())}`,'','## Profil',data.profile.name||'Sans prénom renseigné','','## Routines'];for(let r of data.routines){lines.push('',`### ${r.title}`,`Domaine : ${r.subject||'Général'}`,`État : ${r.status==='paused'?'En pause':'En cours'}`,`Jours : ${r.days.map(i=>DAYNAMES[i]).join(', ')||'Sans jours fixes'}`);for(let [label,key] of [['Description','description'],['Départ','trigger'],['Durée','duration'],['Version courte','short'],['Prochaine action','next']])if(r[key])lines.push(`${label} : ${r[key]}`);for(let l of filtered.logs.filter(x=>x.routineId===r.id).sort((a,b)=>a.date.localeCompare(b.date)))lines.push(`- ${l.date} : ${l.status==='done'?(l.version==='short'?'réalisée, version courte':'réalisée'):l.status==='missed'?'non réalisée':'non renseignée'}${l.note?' — '+l.note:''}`)}lines.push('','## Astuces contextuels');for(let s of data.situations){lines.push('',`### ${s.title}`,`Sujet : ${s.subject}${s.topic?' / '+s.topic:''}`,`État : ${statusOf(s)[0]}`);if(s.context)lines.push(`Contexte : ${s.context}`);for(let p of s.pistes||[])lines.push(`Piste (${p.status==='utile'?'utile pour moi':'en cours d’essai'}) : ${p.text}`);let js=filtered.journal.filter(j=>j.situationId===s.id);for(let j of js)lines.push(`Constat du ${j.date} : ${j.text}`)}lines.push('','## Principes');for(let g of [{id:'',title:'Mes principes'},...data.principleSections]){lines.push('',`### ${g.title}`);for(let p of data.principles.filter(p=>p.sectionId===g.id)){lines.push('',`#### ${p.title}`,`Sujet : ${p.subject}${p.topic?' / '+p.topic:''}`,`État : ${p.status}`);if(p.why)lines.push(p.why);if(p.context)lines.push(`Quand : ${p.context}`)}}lines.push('','## Journal');for(let j of filtered.journal.slice().sort((a,b)=>a.date.localeCompare(b.date)))lines.push('',`### ${j.date} · ${j.subject||'Général'}`,j.text,j.routineId?`Routine : ${routineName(j.routineId)}`:'');download(filename+'.md',lines.join('\n'),'text/markdown;charset=utf-8');showToast('Compte rendu exporté')}
  document.addEventListener('change',async ev=>{if(ev.target.id!=='import-file')return;let file=ev.target.files?.[0];if(!file)return;try{let obj=JSON.parse(await file.text()),v=obj.data;if(obj.format!=='mon-carnet'||obj.version!==1||!v||!['routines','logs','journal','situations','principles','topics'].every(k=>Array.isArray(v[k]))||!v.profile||typeof v.profile!=='object')throw Error('format');if(!confirm('Importer cette sauvegarde et remplacer les données présentes sur ce téléphone ?'))return;data=v;normalizePrinciples();save();go('today');showToast('Sauvegarde importée')}catch{showToast('Ce fichier ne correspond pas à une sauvegarde du carnet.')}});
  document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&modal)closeModal()});
  render();
})();
</script>
