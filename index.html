  function remove(kind,id){let names={journal:'cette note',situation:'cette astuce',routine:'cette routine et son suivi',principle:'ce principe',piste:'cette piste','principle-section':'cette sous-section'};let message=kind.endsWith('-section')?`Supprimer cette sous-section ? Ses fiches seront conservées dans « ${baseSection(kind==='principle-section'?'principle':'situation')} ».`:`Supprimer ${names[kind]} ?`;if(kind==='type'){if(data.situationTypes.length===1){showToast('Garde au moins un type de situation.');return}let fallback=data.situationTypes.find(t=>t!==id);message=`Supprimer le type « ${id} » ? Ses fiches seront classées dans « ${fallback} ».`}if(!confirm(message))return;if(kind==='type'){data.situationTypes=data.situationTypes.filter(t=>t!==id);for(let k of ['routines','journal','principles','situations'])data[k].forEach(x=>{if(x.subject===id)x.subject=data.situationTypes[0]});subjectFilter=principleSubjectFilter='Toutes'}if(kind==='situation-section'){data.situationSections=data.situationSections.filter(x=>x.id!==id);data.situations.forEach(x=>{if(x.sectionId===id)x.sectionId=''})}if(kind==='principle-section'){data.principleSections=data.principleSections.filter(x=>x.id!==id);data.principles.forEach(x=>{if(x.sectionId===id)x.sectionId=''})}if(kind==='piste'){let s=data.situations.find(x=>x.id===detailId);if(s)s.pistes=s.pistes.filter(x=>x.id!==id)}if(kind==='journal')data.journal=data.journal.filter(x=>x.id!==id);if(kind==='situation'){data.situations=data.situations.filter(x=>x.id!==id);data.journal.forEach(x=>{if(x.situationId===id)x.situationId=''})}if(kind==='routine'){data.routines=data.routines.filter(x=>x.id!==id);data.logs=data.logs.filter(x=>x.routineId!==id);data.journal.forEach(x=>{if(x.routineId===id)x.routineId=''});data.situations.forEach(x=>{if(x.routineId===id)x.routineId=''})}if(kind==='principle')data.principles=data.principles.filter(x=>x.id!==id);save();if(['situation','routine'].includes(kind))go(kind==='situation'?'repères':'routine   function closeMenus(){document.querySelectorAll('.menu-panel').forEach(p=>{p.hidden=true;p.previousElementSibling.setAttribute('aria-expanded','false')})}

    if(f.id==='section-form'){let title=trim(v.title),sections=sectionsFor(modal==='principle-section'?'principle':'situation');if(!title)return;if(editId)sections.find(x=>x.id===editId).title=title;else sections.push({id:uid(),title});save();closeModal();showToast('Sous-section enregistrée');return}
    if(f.id==='move-form'){let item=data[window._moveKind==='principle'?'principles':'situations'].find(x=>x.id===editId);item.sectionId=v.sectionId||'';data.ui.collapsedSections[window._moveKind+':'+item.sectionId]=false;save();closeModal();showToast('Fiche déplacée');return}
    if(f.id==='type-form'){let title=trim(v.title);if(!title)return;if(title==='Toutes'||data.situationTypes.some(t=>t!==editId&&t.toLocaleLowerCase()===title.toLocaleLowerCase())){showToast('Ce nom est déjà utilisé.');return}if(editId){data.situationTypes=data.situationTypes.map(t=>t===editId?title:t);for(let k of ['routines','journal','principles','situations'])data[k].forEach(x=>{if(x.subject===editId)x.subject=title})}else data.situationTypes.push(title);subjectFilter=principleSubjectFilter='Toutes';save();closeModal();showToast('Type enregistré');return}
    if(f.id==='principle-form'){let obj={title:trim(v.title),why:trim(v.why),context:trim(v.context),sectionId:v.sectionId||'',status:v.status};if(!obj.title)return;if(editId)Object.assign(data.principles.find(x=>x.id===editId),obj);else{let id=uid();data.principles.push({id,subject:data.situationTypes[0],pinned:false,...obj});data.ui.expandedCards['principle:'+id]=true}if(editId)data.ui.expandedCards['principle:'+editId]=true;data.ui.collapsedSections['principle:'+obj.sectionId]=false;save();closeModal();showToast('Principe enregistré');return}
    if(f.id==='log-form'){let date=window._logDate||today(),l=logFor(detailId,date);if(!l){l={id:uid(),routineId:detailId,date};data.logs.push(l)}Object.assign(l,{status:v.status,version:v.version,note:trim(v.note)});if(!l.status&&!l.note)data.logs=data.logs.filter(x=>x!==l);save();closeModal();showToast('Séance enregistrée');return}
    if(f.id==='export-form'){exportData(v.format,v.period);return}
  });
  function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
  function exportData(format,period){let cutoff=period==='all'?'0000-00-00':addDays(today(),-(Number(period)-1)), filtered={...data,logs:data.logs.filter(x=>x.date>=cutoff),journal:data.journal.filter(x=>x.date>=cutoff)};let filename='mon-carnet-'+today();if(format==='json'){download(filename+'.json',JSON.stringify({format:'mon-carnet',version:1,exportedAt:new Date().toISOString(),data},null,2),'application/json;charset=utf-8');showToast('Sauvegarde exportée');return}
    let lines=['# Mon carnet',`Export du ${niceDate(today())}`,'','## Profil',data.profile.name||'Sans prénom renseigné','','## Routines'];for(let r of data.routines){lines.push('',`### ${r.title}`,`Domaine : ${r.subject||'Général'}`,`État : ${r.status==='paused'?'En pause':'En cours'}`,`Jours : ${r.days.map(i=>DAYNAMES[i]).join(', ')||'Sans jours fixes'}`);for(let [label,key] of [['Description','description'],['Départ','trigger'],['Durée','duration'],['Version courte','short'],['Prochaine action','next']])if(r[key])lines.push(`${label} : ${r[key]}`);for(let l of filtered.logs.filter(x=>x.routineId===r.id).sort((a,b)=>a.date.localeCompare(b.date)))lines.push(`- ${l.date} : ${l.status==='done'?(l.version==='short'?'réalisée, version courte':'réalisée'):l.status==='missed'?'non réalisée':'non renseignée'}${l.note?' — '+l.note:''}`)}lines.push('','## Astuces contextuels');for(let s of data.situations){lines.push('',`### ${s.title}`,`Type de situation : ${s.subject}`,`Sous-section : ${data.situationSections.find(g=>g.id===s.sectionId)?.title||baseSection('situation')}`,`État : ${statusOf(s)[0]}`);if(s.why)lines.push(`Ce que j’en retiens : ${s.why}`);if(s.context)lines.push(`Quand cela m’aide : ${s.context}`);for(let p of s.pistes||[])lines.push(`Piste (${p.status==='utile'?'utile pour moi':'en cours d’essai'}) : ${p.text}`);let js=filtered.journal.filter(j=>j.situationId===s.id);for(let j of js)lines.push(`Constat du ${j.date} : ${j.text}`)}lines.push('','## Principes');for(let g of [{id:'',title:baseSection('principle')},...data.principleSections]){if(!g.id&&!data.principles.some(p=>!p.sectionId))continue;lines.push('',`### ${g.title}`);for(let p of data.principles.filter(p=>p.sectionId===g.id)){lines.push('',`#### ${p.title}`,`Type de situation : ${p.subject}`,`État : ${p.status}`);if(p.why)lines.push(p.why);if(p.context)lines.push(`Quand : ${p.context}`)}}lines.push('','## Journal');for(let j of filtered.journal.slice().sort((a,b)=>a.date.localeCompare(b.date)))lines.push('',`### ${j.date} · ${j.subject||'Général'}`,j.text,j.routineId?`Routine : ${routineName(j.routineId)}`:'');download(filename+'.md',lines.join('\n'),'text/markdown;charset=utf-8');showToast('Compte rendu exporté')}
  document.addEventListener('change',async ev=>{if(ev.target.id!=='import-file')return;let file=ev.target.files?.[0];if(!file)return;try{let obj=JSON.parse(await file.text()),v=obj.data;if(obj.format!=='mon-carnet'||obj.version!==1||!v||!['routines','logs','journal','situations','principles'].every(k=>Array.isArray(v[k]))||!v.profile||typeof v.profile!=='object')throw Error('format');if(!confirm('Importer cette sauvegarde et remplacer les données présentes sur ce téléphone ?'))return;data=v;normalizePrinciples();save();go('today');showToast('Sauvegarde importée')}catch{showToast('Ce fichier ne correspond pas à une sauvegarde du carnet.')}});
  document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){closeMenus();if(modal)closeModal()}});
  render();
})();
</script>
